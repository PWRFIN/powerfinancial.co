<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PWRFIN — IUL Agent Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Ciervo Wealth Management Logo Palette */
    --navy: #19271a; /* Deep Forest Green */
    --navy2: #121c13; /* Darker Forest Green */
    --card: #203121; /* Card background */
    --card2: #273e29; /* Card hover/secondary */
    --gold: #A3B19B; /* Sage Green */
    --gold2: #d67a4d; /* Rust/Terracotta */
    --goldlight: rgba(163, 177, 155, 0.15); /* Sage light */
    --text: #F3F4F1; /* Off-white text */
    --muted: #9ba89e; /* Muted sage */
    --accent: #d67a4d; /* Rust accent */
    --green: #4ade80;
    --red: #f87171;
    --border: rgba(163, 177, 155, 0.20); /* Sage border */
    --sidebar-w: 240px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--navy); color: var(--text); font-family: 'Sora', sans-serif; font-size: 14px; line-height: 1.6; display: flex; min-height: 100vh; }

  /* SIDEBAR */
  #sidebar {
    width: var(--sidebar-w); height: 100vh; background: var(--navy2);
    border-right: 1px solid var(--border); position: fixed; top: 0; left: 0; z-index: 100;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .brand { padding: 20px 18px 16px; border-bottom: 1px solid var(--border); }
  .brand-name { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--gold); letter-spacing: 1px; }
  .brand-sub { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
  .nav { flex: 1; padding: 12px 0; overflow-y: auto; }
  .nav-section { font-size: 9px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); padding: 14px 18px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 18px;
    cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500;
    border-left: 3px solid transparent; transition: all 0.2s;
  }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .nav-item.active { color: var(--gold); border-left-color: var(--gold); background: var(--goldlight); }
  .nav-item .icon { width: 18px; text-align: center; font-size: 15px; }
  .progress-bar { padding: 14px 18px; border-top: 1px solid var(--border); }
  .progress-label { font-size: 10px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .progress-track { background: var(--border); border-radius: 4px; height: 4px; }
  .progress-fill { background: var(--gold); height: 4px; border-radius: 4px; width: 0%; transition: width 0.3s; }

  /* MAIN */
  #main { margin-left: var(--sidebar-w); flex: 1; padding: 0; }
  .section { display: none; padding: 32px 36px; max-width: 1000px; }
  .section.active { display: block; }
  .section-header { margin-bottom: 28px; }
  .section-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 3px; color: var(--gold); margin-bottom: 8px; }
  .section-title { font-family: 'Playfair Display', serif; font-size: 30px; color: var(--text); line-height: 1.2; }
  .section-desc { color: var(--muted); margin-top: 8px; font-size: 14px; max-width: 680px; }

  /* CARDS */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
  .card-sm { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; }
  .card-gold { border-color: rgba(163,177,155,0.30); background: var(--goldlight); }
  .card-red { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.06); }
  .card-green { border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.06); }
  .card-title { font-weight: 600; font-size: 15px; margin-bottom: 10px; color: var(--text); }
  .card-title.gold { color: var(--gold); }

  /* FLOW STEPS */
  .flow { display: flex; gap: 0; margin: 24px 0; }
  .flow-step { flex: 1; background: var(--card); border: 1px solid var(--border); padding: 18px 16px; position: relative; }
  .flow-step:not(:last-child)::after {
    content: '▶'; position: absolute; right: -14px; top: 50%; transform: translateY(-50%);
    color: var(--gold); font-size: 16px; z-index: 2; background: var(--navy); padding: 2px;
  }
  .flow-step:first-child { border-radius: 10px 0 0 10px; }
  .flow-step:last-child { border-radius: 0 10px 10px 0; }
  .flow-num { font-size: 11px; color: var(--gold); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .flow-name { font-weight: 600; margin: 4px 0; font-size: 15px; }
  .flow-time { font-size: 11px; color: var(--muted); }
  .flow-desc { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

  /* STRATEGY CARDS */
  .strategy-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 16px; }
  .strategy-card { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 22px; cursor: pointer; transition: all 0.25s; }
  .strategy-card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .strategy-card.selected { border-color: var(--gold); background: var(--goldlight); }
  .strategy-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 6px; }
  .strategy-name { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--gold); margin-bottom: 10px; }
  .strategy-desc { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .strategy-bullets { list-style: none; margin-top: 12px; }
  .strategy-bullets li { font-size: 13px; color: var(--text); padding: 3px 0; padding-left: 16px; position: relative; }
  .strategy-bullets li::before { content: '→'; position: absolute; left: 0; color: var(--gold); font-size: 12px; }

  /* DISCOVERY FORM */
  .form-section { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 20px; }
  .form-section:last-child { border-bottom: none; }
  .form-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gold); margin-bottom: 12px; font-weight: 600; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-row.three { grid-template-columns: 1fr 1fr 1fr; }
  .form-row.single { grid-template-columns: 1fr; }
  .form-field { display: flex; flex-direction: column; gap: 4px; }
  .form-field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .form-field input, .form-field textarea, .form-field select {
    background: var(--navy); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 8px 12px; font-family: 'Sora', sans-serif; font-size: 13px;
    transition: border-color 0.2s;
  }
  .form-field input:focus, .form-field textarea:focus { outline: none; border-color: var(--gold); }
  .form-field textarea { min-height: 70px; resize: vertical; }
  .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .checkbox-item { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--navy); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 12px; transition: all 0.2s; }
  .checkbox-item:hover { border-color: var(--gold); }
  .checkbox-item input { display: none; }
  .checkbox-item.checked { background: var(--goldlight); border-color: var(--gold); color: var(--gold); }
  .alert-box { background: rgba(214,122,77,0.1); border: 1px solid rgba(214,122,77,0.4); border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #fbcba6; margin: 12px 0; display: flex; gap: 10px; align-items: flex-start; }
  .alert-box .alert-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

  /* ILLUSTRATION COLUMNS */
  .col-table { width: 100%; border-collapse: collapse; margin: 12px 0; }
  .col-table th { background: var(--card2); color: var(--gold); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
  .col-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  .col-table tr:hover td { background: rgba(255,255,255,0.02); }
  .col-table .col-name { font-weight: 600; color: var(--text); min-width: 180px; }
  .col-table .col-purpose { color: var(--muted); }
  .col-table .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; }
  .tag-show { background: rgba(74,222,128,0.15); color: #4ade80; }
  .tag-hide { background: rgba(248,113,113,0.15); color: #f87171; }
  .tag-key { background: rgba(163,177,155,0.25); color: var(--gold); }

  /* EDUCATION DROPS */
  .topic-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .topic-tab { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); font-size: 12px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .topic-tab:hover { border-color: var(--gold); color: var(--text); }
  .topic-tab.active { background: var(--goldlight); border-color: var(--gold); color: var(--gold); font-weight: 600; }
  .topic-content { display: none; }
  .topic-content.active { display: block; }
  .script-box { background: var(--navy); border-left: 3px solid var(--gold); border-radius: 0 8px 8px 0; padding: 14px 18px; margin: 12px 0; font-size: 13px; line-height: 1.7; color: var(--text); font-style: italic; }
  .trigger-questions { margin-top: 14px; }
  .trigger-q { background: var(--card2); border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; color: var(--text); }
  .trigger-q::before { content: '?  '; color: var(--gold); font-weight: 700; font-style: normal; }
  .stat-highlight { display: inline-block; background: var(--goldlight); border: 1px solid rgba(163,177,155,0.30); border-radius: 6px; padding: 4px 10px; color: var(--gold); font-weight: 700; font-size: 14px; margin: 4px 2px; }

  /* OBJECTIONS */
  .objection-item { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .objection-trigger { padding: 16px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: var(--card); transition: background 0.2s; }
  .objection-trigger:hover { background: var(--card2); }
  .objection-q { font-weight: 600; font-size: 14px; color: var(--text); }
  .objection-q::before { content: '"'; color: var(--muted); }
  .objection-q::after { content: '"'; color: var(--muted); }
  .objection-arrow { color: var(--gold); transition: transform 0.2s; font-size: 12px; }
  .objection-arrow.open { transform: rotate(90deg); }
  .objection-body { display: none; padding: 16px 20px; border-top: 1px solid var(--border); background: var(--navy); }
  .objection-body.open { display: block; }
  .response-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--gold); margin-bottom: 8px; }
  .response-text { font-size: 13px; line-height: 1.7; color: var(--text); }

  /* APPLICATION */
  .app-steps { margin-top: 16px; }
  .app-step { display: flex; gap: 16px; margin-bottom: 20px; position: relative; }
  .app-step:not(:last-child)::after {
    content: ''; position: absolute; left: 15px; top: 36px; bottom: -12px;
    width: 2px; background: var(--border);
  }
  .step-num { width: 32px; height: 32px; border-radius: 50%; background: var(--goldlight); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: var(--gold); flex-shrink: 0; }
  .step-content { flex: 1; padding-top: 4px; }
  .step-title { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .step-body { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .step-body strong { color: var(--text); }
  .file-name { display: inline-block; background: var(--navy); border: 1px dashed var(--gold); border-radius: 6px; padding: 6px 14px; font-family: monospace; font-size: 12px; color: var(--gold2); margin: 6px 0; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .info-item { background: var(--card); border-radius: 6px; padding: 1
