<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PWRFIN — IUL Agent Field Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Power Financial Custom Palette */
    --navy: #f0e8dd; /* Main Background */
    --navy2: rgba(240, 232, 221, 0.98); /* Sidebar Background */
    --card: rgba(255, 255, 255, 0.92); /* Card background */
    --gold: #834925; /* Important text/links/accents */
    --gold2: #b99f6e; /* Box outlines / secondary accent */
    --goldlight: rgba(131, 73, 37, 0.08); /* Light accent background */
    --text: #514c35; /* Main text */
    --muted: #7c755c; /* Muted text */
    --accent: #834925; /* Links and highlights */
    --green: #16a34a;
    --red: #dc2626;
    --border: #b99f6e; /* Box outlines */
    --sidebar-w: 260px;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    background-color: var(--navy); 
    background-image: url('PowerBackground.jpeg');
    background-size: cover;
    background-attachment: fixed;
    background-position: center;
    color: var(--text); 
    font-family: 'Sora', sans-serif; 
    font-size: 14px; 
    line-height: 1.6; 
    display: flex; 
    min-height: 100vh; 
  }

  /* SIDEBAR */
  #sidebar {
    width: var(--sidebar-w); height: 100vh; background: var(--navy2);
    border-right: 2px solid var(--border); position: fixed; top: 0; left: 0; z-index: 100;
    display: flex; flex-direction: column; overflow-y: auto;
    box-shadow: 4px 0 15px rgba(131, 73, 37, 0.1);
    backdrop-filter: blur(10px);
  }
  .brand { padding: 30px 20px 20px; border-bottom: 2px solid var(--border); text-align: center; background: #ffffff; }
  .brand-sub { font-size: 13px; color: var(--text); letter-spacing: 2px; text-transform: uppercase; margin-top: 10px; font-weight: 800; }
  
  .nav { flex: 1; padding: 20px 0; overflow-y: auto; }
  .nav-section { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--gold2); padding: 14px 24px 6px; font-weight: 800; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin: 4px 16px;
    cursor: pointer; color: var(--text); font-size: 14px; font-weight: 600;
    border-radius: 8px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .nav-item:hover { color: var(--gold); background: var(--goldlight); transform: translateX(4px); }
  .nav-item.active { color: #ffffff; background-color: var(--gold); box-shadow: 0 4px 12px rgba(131, 73, 37, 0.3); font-weight: 700; transform: scale(1.02); }
  .nav-item .icon { width: 20px; text-align: center; font-size: 16px; }
  
  .progress-bar { padding: 16px 20px; border-top: 2px solid var(--border); background: #ffffff; }
  .progress-label { font-size: 11px; color: var(--gold); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; text-align: center; }
  .progress-track { background: rgba(185, 159, 110, 0.3); border-radius: 6px; height: 8px; overflow: hidden; }
  .progress-fill { background: var(--gold); height: 8px; border-radius: 6px; width: 0%; transition: width 0.4s ease; }

  /* MAIN */
  #main { margin-left: var(--sidebar-w); flex: 1; padding: 0; }
  .section { display: none; padding: 40px 44px; max-width: 1050px; margin: 0 auto; }
  .section.active { display: block; animation: fadeIn 0.4s ease-in-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .section-header { margin-bottom: 32px; background: rgba(255,255,255,0.85); padding: 24px; border-radius: 12px; border: 2px solid var(--border); box-shadow: 0 4px 15px rgba(131, 73, 37, 0.08); backdrop-filter: blur(5px); }
  .section-tag { font-size: 12px; text-transform: uppercase; letter-spacing: 3px; color: var(--gold2); margin-bottom: 8px; font-weight: 800; }
  .section-title { font-family: 'Playfair Display', serif; font-size: 38px; color: var(--gold); line-height: 1.2; font-weight: 800; }
  .section-desc { color: var(--text); margin-top: 10px; font-size: 15px; max-width: 800px; font-weight: 500; }

  /* CARDS & DYNAMIC BOXES */
  .card { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 28px; margin-bottom: 24px; box-shadow: 0 6px 16px rgba(131, 73, 37, 0.06); transition: transform 0.2s, box-shadow 0.2s; backdrop-filter: blur(8px); }
  .card:hover { box-shadow: 0 10px 24px rgba(131, 73, 37, 0.12); border-color: var(--gold); }
  .card-sm { background: #ffffff; border: 2px solid var(--border); border-radius: 10px; padding: 18px 22px; box-shadow: 0 4px 10px rgba(131, 73, 37, 0.04); transition: transform 0.2s; }
  .card-sm:hover { transform: translateY(-2px); border-color: var(--gold); }
  .card-gold { border: 3px solid var(--gold2); background: #ffffff; box-shadow: 0 8px 20px rgba(131, 73, 37, 0.08); }
  .card-red { border-color: rgba(220,38,38,0.5); background: rgba(220,38,38,0.04); }
  .card-green { border-color: rgba(22,163,74,0.5); background: rgba(22,163,74,0.04); }
  .card-title { font-weight: 800; font-size: 18px; margin-bottom: 12px; color: var(--gold); }
  
  /* FLOW STEPS */
  .flow { display: flex; gap: 16px; margin: 32px 0; flex-wrap: wrap; }
